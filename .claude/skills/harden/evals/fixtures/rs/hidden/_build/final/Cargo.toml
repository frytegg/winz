[package]
name = "matchbook"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "Limit order book and trade matching engine with pluggable allocation strategies"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
tickfmt = { path = "crates/tickfmt" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
