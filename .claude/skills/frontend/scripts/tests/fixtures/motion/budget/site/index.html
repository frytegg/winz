<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion budget fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  .explainer { width: 120px; height: 40px; background: #234; animation: travel 900ms ease-out both; }
  @keyframes travel { from { transform: translateX(0); } to { transform: translateX(240px); } }
  @media (prefers-reduced-motion: reduce) {
    .explainer { animation: none; transform: translateX(240px); }
  }
</style>
</head>
<body>
<main>
  <h1>How a batch moves from the queue to the chain</h1>
  <div class="explainer" role="img" aria-label="A batch moving from the queue to the chain"></div>
</main>
</body>
</html>
