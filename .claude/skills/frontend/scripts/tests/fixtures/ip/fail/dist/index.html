<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbitly</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <img class="mark" src="/img/mark.svg" alt="Orbitly" width="40" height="40">
  <img class="sponsor-locked" src="/img/testchain-horizontal.svg" alt="Testchain">
</header>
<main>
  <section class="hero">
    <h1 data-hero="h1">Settle every cross border invoice in seconds with fully automated compliance checks</h1>
    <p>Fjord Pay already runs on Testchain's settlement layer.</p>
  </section>
  <section class="trusted">
    <h2>Trusted by</h2>
    <div class="row">
      <img src="/img/partner-northwind.svg" alt="Northwind" height="32">
      <img src="/img/partner-fjord.svg" alt="Fjord Pay" height="32">
      <img src="/img/deniedchain-logo.svg" alt="Deniedchain" height="32">
    </div>
  </section>
  <section class="legal">
    <p>Official Testchain integration, reviewed by our team.</p>
  </section>
</main>

</html>
