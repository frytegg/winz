<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction C</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800">
<style>
  html, body { margin: 0; background: #0b0b0c; color: #fafafa; }
  body { font: 16px/1.5 "Generic Sans", sans-serif; }
  .hero { padding: 64px; background: linear-gradient(135deg, #6d28d9, #2563eb); border-radius: 16px; margin: 24px; }
  h1 { font-size: 56px; line-height: 1.05; margin: 0 0 16px; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #18181b; color: #52525b; }
  button { background: #6d28d9; color: #ffffff; border: 0; border-radius: 16px; padding: 12px 24px; font: inherit; }
</style>
</head>
<body>
<section class="hero">
  <span class="badge" data-tell="badge">New</span>
  <h1>The future of finance</h1>
  <p>Lorem ipsum dolor sit amet, for every treasury team on earth.</p>
  <button type="button">Get started</button>
</section>
</body>
</html>
