<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<link rel="preload" href="fonts/qa-block.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="base.css">
</head>
<body>
<header>
  <nav aria-label="Main">
    <a href="#queue">Queue</a>
    <a href="#try">Try it</a>
  </nav>
</header>
<main>
  <h1>Queue clock for lenders</h1>
  <p>Lenders see the withdrawal queue before they sign.</p>
  <h2 class="grad" id="queue">Live queue</h2>
  <section class="band" aria-label="Queue state">
    <p>Current wait: 12 blocks, about 4 minutes.</p>
  </section>
  <img src="img/ok.svg" width="320" height="120" alt="Queue length over the last hour">
  <h2 id="try">Try it</h2>
  <label for="addr">Wallet address</label>
  <input id="addr" type="text" name="addr">
  <p><button class="btn" type="button">Check the queue</button></p>
</main>
<footer><p>Fixture page for the qa gates.</p></footer>
</body>
</html>
