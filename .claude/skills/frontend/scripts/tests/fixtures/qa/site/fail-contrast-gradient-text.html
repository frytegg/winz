<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient text fixture</title>
<link rel="preload" href="fonts/qa-block.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="base.css">
<style>
  .fading { display: inline-block; font-size: 20px; background-image: linear-gradient(90deg, #111111, #dddddd); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<main>
  <h1>Gradient text fixture</h1>
  <p>Lenders see the withdrawal queue before they sign.</p>
  <p class="fading">Fading gradient headline text</p>
</main>
</body>
</html>
