<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout shift fixture</title>
<link rel="preload" href="fonts/qa-block.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="base.css">
<style>
  .table { min-height: 900px; padding: 16px; border: 1px solid #767676; }
</style>
</head>
<body>
<main>
  <h1>Layout shift fixture</h1>
  <p>Lenders see the withdrawal queue before they sign.</p>
  <section class="table" aria-label="Queue table"><p>Below the hero, the queue table loads.</p></section>
  <script>
    window.addEventListener("load", function () {
      requestAnimationFrame(function () {
        setTimeout(function () {
          var banner = document.createElement("div");
          banner.style.height = "320px";
          banner.style.background = "#e8eefc";
          banner.textContent = "Late banner";
          document.body.insertBefore(banner, document.body.firstChild);
        }, 50);
      });
    });
  </script>
</main>
</body>
</html>
