<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat banner</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .stats { display: flex; gap: 48px; justify-content: center; padding: 64px 24px; }
  .num { font-size: 40px; font-weight: 700; }
  .label { font-size: 14px; color: #666; }
</style>
</head>
<body>
  <div class="stats">
    <div class="stat"><div class="num">10K+</div><div class="label">active users</div></div>
    <div class="stat"><div class="num">99.9%</div><div class="label">uptime</div></div>
    <div class="stat"><div class="num">$4.2M</div><div class="label">volume settled</div></div>
    <div class="stat"><div class="num">4.9★</div><div class="label">average rating</div></div>
  </div>
</body>
</html>
