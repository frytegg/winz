<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion that ignores the preference</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .hero { animation: rise 600ms ease-out both; }
  .strip { overflow: hidden; margin-top: 24px; }
  .track { display: flex; gap: 32px; width: max-content; animation: slide 20s linear infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>
  <h1 class="hero">Settlement in minutes</h1>
  <div class="strip"><div class="track"><span>Vaults</span><span>Oracles</span><span>Vaults</span><span>Oracles</span></div></div>
</body>
</html>
