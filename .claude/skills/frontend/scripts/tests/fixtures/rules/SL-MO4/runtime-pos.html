<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>From nowhere</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .card { animation: pop 200ms ease-out both; padding: 24px; border: 1px solid #ddd; max-width: 420px; }
  .menu { transform: scale(0); transition: transform 200ms ease-out; padding: 12px; border: 1px solid #ddd; width: 200px; margin-top: 24px; }
  .menu.open { transform: scale(1); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
</style>
</head>
<body>
  <div class="card"><h2>Review</h2><p>The card pops in from scale(0).</p></div>
  <div class="menu" role="menu"><div role="menuitem">Copy address</div></div>
</body>
</html>
