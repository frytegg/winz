<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gentle scale</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .card { animation: pop 200ms ease-out both; padding: 24px; border: 1px solid #ddd; max-width: 420px; }
  .menu { transform: scale(0.95); opacity: 0; transition: transform 150ms ease-out, opacity 150ms ease-out; padding: 12px; border: 1px solid #ddd; width: 200px; margin-top: 24px; }
  .loader { display: flex; gap: 6px; margin-top: 24px; }
  .loader span { width: 8px; height: 8px; border-radius: 50%; background: #333; animation: grow 1s ease-in-out infinite; }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } }
  @keyframes grow { 0%, 100% { transform: scale(0); } 50% { transform: scale(1); } }
</style>
</head>
<body>
  <div class="card"><h2>Review</h2><p>The card enters from 0.95 with opacity.</p></div>
  <div class="menu" role="menu"><div role="menuitem">Copy address</div></div>
  <div class="loader" role="status" aria-label="Loading"><span></span><span></span><span></span></div>
</body>
</html>
