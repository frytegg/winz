<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content-sized hero</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  header { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #eee; }
  .hero { padding: 96px 24px; background: #f8fafc; text-align: center; }
  h1 { font-size: 56px; margin: 0; }
  .next { padding: 96px 24px; height: 900px; }
</style>
</head>
<body>
  <div class="app">
    <header>Orbit</header>
    <section class="hero"><h1>Settle in one block</h1><p>The hero is as tall as its content.</p></section>
    <section class="next"><h2>The console</h2><p>Visible in the first frame.</p></section>
  </div>
</body>
</html>
