<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourced figures</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  main { max-width: 960px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 48px; }
  .big { font-size: 36px; font-weight: 700; }
  .step { font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Settlement for treasury desks, settled in <span data-ledger="C-003">2 blocks</span></h1>

  <div data-source="testnet" data-as-of="2026-10-01T10:00:00Z"><div class="big">18</div><div>vaults open</div></div>
  <p>Open vaults: <span data-metric data-source="testnet">42 vaults</span></p>
  <div class="big">$29/mo</div>
  <div class="big">2026</div>
  <div class="big">v2.1.0</div>
  <div class="step">3</div>
  <div class="big">1st</div>
</main>
</body>
</html>
