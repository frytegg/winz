<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Static partners</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .partners { display: flex; gap: 48px; padding: 32px 24px; }
  .spinner { width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  .ticker { height: 24px; overflow: hidden; }
  .ticker-track { animation: up 8s linear infinite; }
  .ticker-track div { height: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
</style>
</head>
<body>
  <div class="partners"><a href="#northwind">Northwind</a><a href="#contoso">Contoso</a><a href="#fabrikam">Fabrikam</a></div>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <div class="ticker"><div class="ticker-track"><div>Block 1201</div><div>Block 1202</div><div>Block 1201</div><div>Block 1202</div></div></div>
</body>
</html>
