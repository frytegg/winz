<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T05 runtime negative</title>
<style>
  body { margin: 0; padding: 32px; font-family: Arial, sans-serif; color: #111; }
  .box { width: 300px; margin-bottom: 16px; padding: 16px; border-radius: 12px; }
  blockquote { margin: 0 0 16px; padding: 8px 16px; border-left: 4px solid #7c3aed; }
  .plain { border: 1px solid #ddd; }
  .grey { border: 1px solid #e5e7eb; border-left: 4px solid #9ca3af; }
  .no-heading { border: 1px solid #e5e7eb; border-left: 4px solid #7c3aed; }
  td { padding: 8px; border-left: 4px solid #7c3aed; }
  footer .box { border: 1px solid #e5e7eb; border-left: 4px solid #7c3aed; }
</style>
</head>
<body>
  <blockquote><h3>Quoted note</h3><p>A quotation carries a rule by convention.</p></blockquote>
  <div class="box plain"><h3>Uniform border</h3><p>All four edges are the same.</p></div>
  <div class="box grey"><h3>Grey edge</h3><p>A neutral edge is not an accent.</p></div>
  <div class="box no-heading"><p>A callout with plain text only.</p></div>
  <table><tbody><tr><td><strong>Cell</strong> with a status rule</td></tr></tbody></table>
  <footer><div class="box"><h3>Footer note</h3><p>Footers are skipped.</p></div></footer>
</body>
</html>
