<!doctype html>

<title>SL-T05 runtime positive</title>
<style>
  body { margin: 0; padding: 32px; font-family: Arial, sans-serif; color: #111; }

  .card { width: 300px; padding: 16px; border: 1px solid #e5e7eb; border-left: 4px solid #7c3aed; border-radius: 12px; }

  .stripe::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #10b981; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card" id="border-card"><h3>Collateral ratio</h3><p>Every vault reports its ratio each block.</p></div>

  </div>
