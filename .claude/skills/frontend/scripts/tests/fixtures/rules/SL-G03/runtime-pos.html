<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .dialog { display: none; position: fixed; top: 120px; left: 50%; width: 400px; margin-left: -200px; padding: 24px; background: #1b1b1b; color: #fff; border-radius: 12px; }
  .dialog.open { display: block; }
</style>
</head>
<body>
  <h1>Orbit</h1>
  <button id="connect" type="button">Connect wallet</button>
  <div class="dialog mesh-dark" role="dialog" aria-label="Connect">
    <p>Awesome DApp wants to connect</p>
    <ul><li>Download a wallet</li></ul>
    <p class="footer"><span>Powered by</span> <span>Mesh SDK</span></p>
  </div>
  <script>
    document.getElementById('connect').addEventListener('click', () => {
      document.querySelector('.dialog').classList.add('open');
      alert('error: Wallet not found (eternl)');
    });
  </script>
</body>
</html>
