<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T18 runtime negative</title>
<style>
  body { margin: 0; padding: 48px; font-family: Arial, sans-serif; color: #111; }
  h1 { font: 700 56px Arial, sans-serif; }
  /* a smaller heading may carry an accent: only the largest heading is display text here */
  h2 { font: 700 28px Arial, sans-serif; }
  h2 em, p em { font-family: Georgia, serif; font-style: italic; }
  p { font-size: 18px; }
</style>
</head>
<body>
  <h1>Settle invoices <span>faster</span> than banks</h1>
  <h2>Read the <em>whole</em> ledger</h2>
  <p>Prose emphasis in a serif italic, as on Emil Kowalski's blog, is <em>not</em> display text.</p>
</body>
</html>
