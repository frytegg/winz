<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numbered features</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  section { max-width: 1040px; margin: 0 auto; padding: 48px 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .num { display: block; font-size: 14px; color: #777; margin-bottom: 8px; }
  h3 { margin: 0 0 8px; font-size: 22px; }
</style>
</head>
<body>
<section>
  <h2>Why Orbit</h2>
  <div class="grid">
    <div class="card"><span class="num">01</span><h3>Fast</h3><p>Transfers clear in one block.</p></div>
    <div class="card"><span class="num">02</span><h3>Secure</h3><p>Keys never leave the device.</p></div>
    <div class="card"><span class="num">03</span><h3>Scalable</h3><p>Thousands of accounts per vault.</p></div>
  </div>
</section>
</body>
</html>
