<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card kit</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; background: #fafafa; }
  .grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 24px; padding: 48px 24px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; min-height: 120px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><h3>Vaults</h3><p>Lock collateral per epoch.</p></div>
    <div class="card"><h3>Oracles</h3><p>Two feeds per market.</p></div>
    <div class="card"><h3>Liquidations</h3><p>Auctions every block.</p></div>
    <div class="card"><h3>Governance</h3><p>Votes weighted by stake.</p></div>
    <div class="card"><h3>Treasury</h3><p>Fees flow to a multisig.</p></div>
    <div class="card"><h3>Bridges</h3><p>One canonical route.</p></div>
    <div class="card"><h3>Analytics</h3><p>Daily snapshots of positions.</p></div>
    <div class="card"><h3>Support</h3><p>Answers within a day.</p></div>
  </div>
</body>
</html>
