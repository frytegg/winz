<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Centred hero</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .hero { text-align: center; padding: 120px 24px; }
  h1 { font-size: 56px; margin: 0 0 16px; }
  .ctas { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #111; color: #fff; text-decoration: none; }
  .ghost { background: none; color: #111; border: 1px solid #111; }
</style>
</head>
<body>
  <section class="hero">
    <h1>Ship faster with Orbit</h1>
    <p>The settlement layer for everyone.</p>
    <div class="ctas"><a class="btn" href="#start">Get started</a><a class="btn ghost" href="#more">Learn more →</a></div>
  </section>
</body>
</html>
