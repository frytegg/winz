<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T12 runtime positive</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .hero { height: 860px; padding: 64px; box-sizing: border-box; }
  section.feature { min-height: 640px; padding: 64px; box-sizing: border-box; }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.3s ease-out, transform 0.3s ease-out; }
  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="hero"><h1>Settle invoices in one block</h1><p>Reconcile every invoice against the ledger.</p></div>
  <section class="feature" id="match"><div class="reveal"><h2>Match</h2><p>Invoices are matched to payments as they land.</p></div></section>
  <section class="feature" id="flag"><div class="reveal"><h2>Flag</h2><p>Payments that do not clear are flagged for review.</p></div></section>
  <section class="feature" id="settle"><div class="reveal"><h2>Settle</h2><p>Suppliers are paid the same day, with a receipt.</p></div></section>
  <script>
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      }
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
