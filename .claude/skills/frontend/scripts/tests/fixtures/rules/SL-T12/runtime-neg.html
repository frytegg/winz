<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T12 runtime negative</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .hero { height: 860px; padding: 64px; box-sizing: border-box; }
  /* one orchestrated load moment in the first viewport: a documented legitimate use */
  .hero h1 { animation: rise 0.4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  section.feature { min-height: 640px; padding: 64px; box-sizing: border-box; }
  .card { position: relative; padding: 16px; border: 1px solid #ddd; }
  /* hover-only content stays hidden through the scroll: it is not a scroll reveal */
  .tip { opacity: 0; }
  .card:hover .tip { opacity: 1; }
</style>
</head>
<body>
  <div class="hero"><h1>Settle invoices in one block</h1><p>Reconcile every invoice against the ledger.</p></div>
  <section class="feature"><h2>Match</h2><p>Invoices are matched to payments as they land.</p></section>
  <section class="feature"><h2>Flag</h2><div class="card"><p>Payments that do not clear are flagged.</p><p class="tip">Hover detail: the rule that flagged it.</p></div></section>
  <section class="feature"><h2>Settle</h2><p>Suppliers are paid the same day, with a receipt.</p></section>
  <script>
    // An observer that only records what is on screen (analytics), never hides or shows anything.
    const seen = new Set();
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) if (entry.isIntersecting) seen.add(entry.target);
    });
    document.querySelectorAll('section').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
