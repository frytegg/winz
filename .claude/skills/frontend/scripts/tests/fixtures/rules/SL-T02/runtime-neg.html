<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T02 runtime negative</title>
<style>
  body { margin: 0; padding: 48px; font-family: Arial, sans-serif; color: #111; }
  h1 { font-size: 56px; color: #1e1b4b; }
  /* text clipped to a flat fill: no gradient */
  .flat { font-size: 40px; background: #334155; -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* a gradient block with ordinary white text on it */
  .banner { padding: 24px; background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff; }
  /* a clipped gradient hidden under opaque text */
  .covered { font-size: 40px; background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; background-clip: text; color: #111; }
  /* a "gradient" whose stops are the same colour */
  .same { font-size: 40px; background: linear-gradient(90deg, #7c3aed, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <h1>Ship proofs, not promises</h1>
  <p class="flat">Flat clipped fill</p>
  <div class="banner">Every settlement carries its receipt.</div>
  <p class="covered">Covered gradient</p>
  <p class="same">Single-colour gradient</p>
</body>
</html>
