<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budgeted UI motion</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .btn { transition: transform 150ms ease-out; padding: 10px 16px; }
  .btn:active { transform: scale(0.97); }
  .modal { transition: opacity 250ms ease-out, transform 250ms ease-out; padding: 24px; border: 1px solid #ddd; max-width: 480px; margin-top: 24px; }
  .drawer { position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: #fafafa; border-left: 1px solid #ddd;
    transition: transform 500ms cubic-bezier(0.32, 0.72, 0, 1); }
  .spinner { width: 24px; height: 24px; margin-top: 24px; border: 3px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <button class="btn" type="button">Deposit</button>
  <div class="modal" role="dialog" aria-label="Review">Review the transfer before signing.</div>
  <aside class="drawer">A full-height sheet may take 500 ms.</aside>
  <div class="spinner" role="status" aria-label="Loading"></div>
</body>
</html>
