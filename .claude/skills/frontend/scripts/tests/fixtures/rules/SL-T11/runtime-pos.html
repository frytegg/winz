<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T11 runtime positive</title>
<style>
  /* the shadcn new-york-v4 neutral scaffold, untouched */
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --muted: oklch(0.97 0 0);
    --accent: oklch(0.97 0 0);
    --border: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
  }
  body { margin: 0; padding: 48px; background: var(--background); color: var(--foreground); font-family: Arial, sans-serif; }
  [data-slot="card"] { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 24px; width: 360px; }
  [data-slot="button"] { background: var(--primary); color: var(--primary-foreground); border: 0; border-radius: calc(var(--radius) - 2px); padding: 8px 16px; }
</style>
</head>
<body>
  <div data-slot="card" class="flex flex-col gap-6 rounded-xl border bg-card py-6 shadow-sm">
    <h3 data-slot="card-title">Vault health</h3>
    <button data-slot="button" class="inline-flex items-center bg-primary text-primary-foreground hover:bg-primary/90">Open vault</button>
  </div>
</body>
</html>
