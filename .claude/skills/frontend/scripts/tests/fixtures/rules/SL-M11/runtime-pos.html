<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .bento { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 160px; gap: 16px; max-width: 1040px; margin: 48px auto; }
  .tile { background: #f4f4f5; border-radius: 16px; padding: 24px; }
  .wide { grid-column: span 2; }
  .tall { grid-row: span 2; }
</style>
</head>
<body>
  <div class="bento">
    <div class="tile wide">Settlement</div>
    <div class="tile tall">Custody</div>
    <div class="tile">Oracles</div>
    <div class="tile">Vaults</div>
    <div class="tile">Audits</div>
    <div class="tile">Support</div>
  </div>
</body>
</html>
