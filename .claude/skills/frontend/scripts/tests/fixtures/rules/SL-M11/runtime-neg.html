<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Even grid</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 160px; gap: 16px; max-width: 1040px; margin: 48px auto; }
  .tile { background: #f4f4f5; border-radius: 16px; padding: 24px; }
  .full { grid-column: 1 / -1; background: none; padding: 0; }
</style>
</head>
<body>
  <div class="grid">
    <h2 class="full">Six equal modules</h2>
    <div class="tile">Settlement</div>
    <div class="tile">Custody</div>
    <div class="tile">Oracles</div>
    <div class="tile">Vaults</div>
    <div class="tile">Audits</div>
    <div class="tile">Support</div>
  </div>
</body>
</html>
