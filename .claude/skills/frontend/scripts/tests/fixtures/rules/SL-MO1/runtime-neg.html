<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Named transitions</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .btn { transition: background-color 150ms ease, transform 120ms ease-out; padding: 10px 16px; border: 1px solid #111; background: #111; color: #fff; }
  .btn:active { transform: scale(0.97); }
  .panel { transition: all 0.3s; padding: 16px; margin-top: 24px; border: 1px solid #ddd; }
</style>
</head>
<body>
  <button class="btn" type="button">Deposit</button>
  <a href="#docs">Read the docs</a>
  <div class="panel">A static panel is not an interactive element.</div>
</body>
</html>
