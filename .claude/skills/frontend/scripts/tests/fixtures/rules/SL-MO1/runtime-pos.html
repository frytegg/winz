<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transition all</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .btn { transition: all 0.2s; padding: 10px 16px; border: 1px solid #111; background: #111; color: #fff; }
  .btn:hover { background: #333; }
  .link { transition: 150ms ease; }
</style>
</head>
<body>
  <button class="btn" type="button">Deposit</button>
  <a class="link" href="#docs">Read the docs</a>
</body>
</html>
