<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glows</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .hero { position: relative; height: 640px; overflow: hidden; }
  .blob { position: absolute; width: 320px; height: 320px; border-radius: 50%; background: #8b5cf6; filter: blur(80px); opacity: 0.6; }
  .blob.one { top: 40px; left: 80px; }
  .blob.two { top: 200px; left: 700px; background: #06b6d4; }
  .glow-card { position: relative; margin: 120px auto 0; width: 420px; padding: 32px; border-radius: 16px; background: #fff;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.5); }
</style>
</head>
<body>
  <div class="hero">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="glow-card"><h2>Deposit</h2><p>Lock test ADA.</p></div>
  </div>
</body>
</html>
