<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neutral elevation</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .hero { position: relative; height: 640px; overflow: hidden; }
  .haze { position: absolute; top: 40px; left: 80px; width: 320px; height: 320px; border-radius: 50%; background: #d4d4d8; filter: blur(60px); }
  .card { position: relative; margin: 120px auto 0; width: 420px; padding: 32px; border-radius: 16px; background: #fff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }
  .focus { position: relative; margin: 32px auto 0; width: 420px; padding: 16px; border-radius: 12px; background: #fff;
    box-shadow: 0 0 24px rgba(37, 99, 235, 0.4); }
</style>
</head>
<body>
  <div class="hero">
    <div class="haze"></div>
    <div class="card"><h2>Deposit</h2><p>A neutral shadow.</p></div>
    <div class="focus"><p>One coloured glow alone stays under the two-element threshold.</p></div>
  </div>
</body>
</html>
