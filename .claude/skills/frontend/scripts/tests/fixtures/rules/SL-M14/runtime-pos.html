<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decorative loops</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .grid-bg { width: 600px; height: 300px; margin: 24px;
    background-image: linear-gradient(to right, rgba(0, 0, 0, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
    background-size: 32px 32px; }
  .status { display: flex; align-items: center; gap: 8px; margin: 24px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s ease-in-out infinite; }
  .type { font-size: 24px; margin: 24px; }
  .caret { display: inline-block; width: 2px; height: 24px; background: #111; vertical-align: middle; animation: blink 1s linear infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
</head>
<body>
  <section class="grid-bg"><h2>Agents settle here</h2></section>
  <div class="status"><span class="dot"></span><span>Systems operational</span></div>
  <p class="type">Deploying vault<span class="caret"></span></p>
</body>
</html>
