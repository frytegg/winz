<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live indicator</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .wash { width: 600px; height: 300px; margin: 24px; background-image: linear-gradient(135deg, #eef2ff, #ffffff); }
  .status { display: flex; align-items: center; gap: 8px; margin: 24px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s ease-in-out infinite; }
  .spinner { width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <section class="wash"><h2>Agents settle here</h2></section>
  <div class="status" data-source="live" data-as-of="2026-10-01T10:00:00Z"><span class="dot"></span><span>Block 1201 received</span></div>
  <div class="spinner" role="status" aria-label="Loading"></div>
</body>
</html>
