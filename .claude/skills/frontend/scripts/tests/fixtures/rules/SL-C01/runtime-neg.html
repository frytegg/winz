<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radius by role</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; padding: 48px; }
  .actions { display: flex; gap: 12px; align-items: center; }
  button { border-radius: 6px; padding: 10px 20px; border: 1px solid #111; background: #111; color: #fff; font-size: 15px; }
  .chip { border-radius: 9999px; background: #fff; color: #111; }
  .icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
</style>
</head>
<body>
  <div class="actions">
    <button>Deposit</button>
    <button>Withdraw</button>
    <button>Open vault</button>
    <button class="chip">Testnet</button>
    <button class="icon" aria-label="Settings">⚙</button>
  </div>
</body>
</html>
