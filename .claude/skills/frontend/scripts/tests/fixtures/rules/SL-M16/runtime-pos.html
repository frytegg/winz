<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assembled visuals</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .row { display: flex; gap: 32px; padding: 32px; }
  .window { width: 520px; height: 320px; border: 1px solid #d4d4d8; border-radius: 12px; overflow: hidden; }
  .bar { display: flex; gap: 8px; padding: 12px; background: #f4f4f5; }
  .bar span { width: 12px; height: 12px; border-radius: 50%; }
  .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }
  .fake-row { height: 16px; margin: 16px; background: #e4e4e7; border-radius: 4px; }
</style>
</head>
<body>
  <div class="row">
    <svg width="600" height="400" viewBox="0 0 600 400" aria-hidden="true">
      <rect x="20" y="20" width="560" height="360" rx="24" fill="#eef2ff"/>
      <circle cx="120" cy="120" r="60" fill="#c7d2fe"/>
      <circle cx="480" cy="110" r="40" fill="#a5b4fc"/>
      <circle cx="300" cy="300" r="70" fill="#818cf8"/>
      <rect x="200" y="80" width="200" height="40" rx="8" fill="#6366f1"/>
      <rect x="200" y="140" width="160" height="16" rx="4" fill="#c7d2fe"/>
      <rect x="200" y="170" width="120" height="16" rx="4" fill="#c7d2fe"/>
      <path d="M40 360 Q 150 250 260 360" fill="#e0e7ff"/>
      <path d="M340 360 Q 450 250 560 360" fill="#e0e7ff"/>
      <ellipse cx="300" cy="60" rx="30" ry="12" fill="#a5b4fc"/>
      <line x1="40" y1="200" x2="160" y2="200" stroke="#818cf8" stroke-width="4"/>
      <line x1="440" y1="200" x2="560" y2="200" stroke="#818cf8" stroke-width="4"/>
      <polygon points="300,200 330,250 270,250" fill="#6366f1"/>
      <circle cx="80" cy="300" r="10" fill="#6366f1"/>
      <circle cx="520" cy="300" r="10" fill="#6366f1"/>
    </svg>
    <div class="window">
      <div class="bar"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <div class="fake-row"></div><div class="fake-row"></div><div class="fake-row"></div>
    </div>
  </div>
</body>
</html>
