<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nested cards</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  .card { border: 1px solid #e4e4e7; border-radius: 12px; padding: 24px; width: 600px; margin: 48px; }
  .inner { border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px; margin-top: 16px; width: 520px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Vault 12</h2>
    <div class="inner"><h3>Collateral</h3><p>Locked until epoch 410.</p></div>
    <div class="inner"><h3>Debt</h3><p>Repaid on every block.</p></div>
  </div>
</body>
</html>
