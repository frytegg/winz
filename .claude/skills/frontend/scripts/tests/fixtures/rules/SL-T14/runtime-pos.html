<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T14 runtime positive</title>
<style>
  body { margin: 0; padding: 48px; font-family: Arial, sans-serif; color: #111; }
  .row { display: flex; gap: 16px; }
  .btn { display: inline-block; padding: 10px 18px; border: 0; border-radius: 8px; color: #fff; font: 15px Arial, sans-serif; text-decoration: none; }
  /* an opacity fade */
  .fade { background: #2563eb; transition: opacity 0.15s; }
  .fade:hover { opacity: 0.8; }
  /* the kit's alpha fade on the fill, ungated */
  .alpha { background: rgb(23, 23, 23); transition: background-color 0.15s; }
  .alpha:hover { background: rgba(23, 23, 23, 0.9); }
  /* the same fade, gated as Tailwind v4 gates hover: */
  .gated { background: rgb(23, 23, 23); transition: background-color 0.15s; }
  @media (hover: hover) { .gated:hover { background: color-mix(in oklab, rgb(23, 23, 23) 80%, transparent); } }
</style>
</head>
<body>
  <div class="row">
    <button class="btn fade" id="fade" type="button">Open the vault</button>
    <a class="btn alpha" id="alpha" href="#deposit">Deposit</a>
    <button class="btn gated" id="gated" type="button">Withdraw</button>
  </div>
</body>
</html>
