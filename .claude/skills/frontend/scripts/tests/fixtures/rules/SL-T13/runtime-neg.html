<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T13 runtime negative</title>
<style>
  body { margin: 0; padding: 48px; font-family: Arial, sans-serif; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  /* hover states change with the element under the pointer, never with its coordinates */
  .card { height: 260px; padding: 24px; border: 1px solid #ddd; border-radius: 12px; background: #fff; transition: all 0.15s ease-out; }
  .card:hover { background: #f4f4f5; transform: translateY(-2px); }
  /* a loading spinner loops on its own */
  .spinner { width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #111; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* a progress bar driven by requestAnimationFrame */
  .track { height: 8px; background: #eee; margin-top: 24px; overflow: hidden; }
  .bar { width: 120px; height: 8px; background: #111; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><h3>Match</h3><p>Invoices are matched to payments.</p><div class="spinner"></div></div>
    <div class="card"><h3>Flag</h3><p>Payments that do not clear are flagged.</p></div>
    <div class="card"><h3>Settle</h3><p>Suppliers are paid the same day.</p></div>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <script>
    // A listener that only records the pointer (analytics); nothing on the page follows it.
    let last = { x: 0, y: 0 };
    window.addEventListener('mousemove', (e) => { last = { x: e.clientX, y: e.clientY }; });
    const bar = document.getElementById('bar');
    const step = (t) => {
      bar.style.transform = `translateX(${(t / 4) % 600}px)`;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  </script>
</body>
</html>
