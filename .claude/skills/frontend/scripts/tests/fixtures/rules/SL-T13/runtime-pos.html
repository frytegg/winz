<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SL-T13 runtime positive</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #fff; background: #0b0b10; }
  /* a spotlight that follows the pointer through custom properties (Magic UI MagicCard shape) */
  .spot { height: 640px; background: radial-gradient(240px circle at var(--x, 50%) var(--y, 50%), rgba(124, 58, 237, 0.35), transparent 70%), #0b0b10; }
  /* a dot that follows the pointer (Aceternity Following Pointer shape) */
  .dot { position: fixed; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #a78bfa; pointer-events: none; }
</style>
</head>
<body>
  <div class="spot" id="spot"></div>
  <div class="dot" id="dot"></div>
  <script>
    const spot = document.getElementById('spot');
    spot.addEventListener('pointermove', (e) => {
      const r = spot.getBoundingClientRect();
      spot.style.setProperty('--x', `${e.clientX - r.left}px`);
      spot.style.setProperty('--y', `${e.clientY - r.top}px`);
    });
    const dot = document.getElementById('dot');
    window.addEventListener('mousemove', (e) => {
      dot.style.transform = `translate(${e.clientX - 8}px, ${e.clientY - 8}px)`;
    });
  </script>
</body>
</html>
