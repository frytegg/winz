<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social proof</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #111; }
  section { max-width: 1040px; margin: 0 auto; padding: 48px 24px; }
  .logos { display: flex; gap: 32px; align-items: center; }
  .quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  figure { margin: 0; padding: 24px; border: 1px solid #e4e4e7; border-radius: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: #ddd; }
</style>
</head>
<body>
<section>
  <p class="label">Trusted by leading teams</p>
  <div class="logos">
    <svg width="96" height="28" viewBox="0 0 96 28"><rect width="96" height="28" rx="4" fill="#888"/></svg>
    <svg width="96" height="28" viewBox="0 0 96 28"><rect width="96" height="28" rx="4" fill="#999"/></svg>
    <svg width="96" height="28" viewBox="0 0 96 28"><rect width="96" height="28" rx="4" fill="#aaa"/></svg>
    <svg width="96" height="28" viewBox="0 0 96 28"><rect width="96" height="28" rx="4" fill="#bbb"/></svg>
  </div>
</section>
<section class="quotes">
  <figure>
    <img class="avatar" src="https://i.pravatar.cc/48?img=3" width="48" height="48" alt="">
    <blockquote>“Orbit cut our settlement time from two days to ten minutes and the whole team loves it.”</blockquote>
    <figcaption>Sarah Chen, CTO at Northwind</figcaption>
  </figure>
  <figure>
    <blockquote>“We moved our entire treasury flow onto Orbit in a single afternoon without any help.”</blockquote>
    <figcaption>Marcus Lee, Head of Treasury Operations at Contoso Freight</figcaption>
  </figure>
</section>
</body>
</html>
