<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visibility fixture</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
    section { padding: 8px; }
    .collapsed { height: 0; overflow: hidden; }
    .offcanvas { position: absolute; left: -9999px; top: 0; width: 300px; }
    .lazy { content-visibility: auto; contain-intrinsic-size: auto 200px; }
    .spacer { height: 3000px; }
    .pinned { position: fixed; right: 0; bottom: 0; width: 200px; }
  </style>
</head>
<body>
  <section data-feature="FR-100"><h2>Plainly visible</h2></section>
  <div class="collapsed"><section data-feature="FR-101"><h2>Inside a collapsed panel</h2></section></div>
  <section data-feature="FR-104" style="opacity: 0"><h2>Transparent</h2></section>
  <details><summary>More</summary><section data-feature="FR-105"><h2>Behind a closed details</h2></section></details>
  <section data-feature="FR-106" class="offcanvas"><h2>Off the canvas</h2></section>
  <div class="collapsed"><section data-feature="FR-107" class="pinned"><h2>Fixed inside a collapsed parent</h2></section></div>
  <section data-feature="FR-108" style="visibility: hidden"><h2>visibility: hidden</h2></section>
  <div class="spacer"></div>
  <section data-feature="FR-103" class="lazy"><h2>Far below, content-visibility: auto</h2></section>
</body>
</html>
