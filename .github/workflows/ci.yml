name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Engine and schema tests start a throwaway Postgres: they need the server binaries.
      - name: Ensure PostgreSQL server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          sudo systemctl stop postgresql || true
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The scripts' own tests (node:test through tsx): turbo's test task does not run them.
      - run: pnpm exec tsx --test scripts/env-check.test.mjs scripts/smoke.test.mjs
      - run: node --test scripts/quicknode-record.test.mjs
      - run: pnpm db:test
      - run: pnpm build
